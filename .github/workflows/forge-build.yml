name: Forge 1.20.1 Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        forge: ['47.2.0', '47.4.10']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain -Pforge_version=${{ matrix.forge }}
      - name: Upload remapped distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meteor-mc1.20.1-forge${{ matrix.forge }}-zh
          path: build/libs/meteor-client-0.5.4-forge-zh.jar
          if-no-files-found: error
